<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRACKMENTO</title>
<style>
/* フォントは fonts/ に同梱（OFL）。/fonts/ で静的配信するので、オフラインでも書き出し結果が変わらない */
@font-face { font-family: "IBM Plex Sans JP"; font-weight: 400; font-style: normal; font-display: swap; src: url("/fonts/IBMPlexSansJP-Regular.ttf") format("truetype"); }
@font-face { font-family: "IBM Plex Sans JP"; font-weight: 700; font-style: normal; font-display: swap; src: url("/fonts/IBMPlexSansJP-Bold.ttf") format("truetype"); }
@font-face { font-family: "Silkscreen"; font-weight: 400; font-style: normal; font-display: swap; src: url("/fonts/Silkscreen-Regular.ttf") format("truetype"); }
@font-face { font-family: "Silkscreen"; font-weight: 700; font-style: normal; font-display: swap; src: url("/fonts/Silkscreen-Bold.ttf") format("truetype"); }
@font-face { font-family: "DotGothic16"; font-weight: 400; font-style: normal; font-display: swap; src: url("/fonts/DotGothic16-Regular.ttf") format("truetype"); }
/* Hallmark · macrostructure: Workbench (app surface, not a tour) · retro-GUI panes: toolbar / results / grid / options
 * theme: custom · vibe: "riso flat, retro GUI, pixel, square corners, cool-leaning" · paper: oklch(95% 0.015 95) · accent: oklch(60% 0.14 235)
 * display: DotGothic16 · body: IBM Plex Sans JP · outlier: Silkscreen (wordmark + cell numbers + count badges) · axes: light / risograph-bold / cool
 * studied: no · context: user-provided (audience: self, J-POP · use: search → place → PNG · tone: utilitarian) · v1.1.0
 * Hallmark · pre-emit critique: P4 H4 E4 S5 R4 V4
 */
:root {
  /* paper / ink (cool-tinted, no pure extremes) */
  --color-paper:    oklch(95% 0.015 95);
  --color-paper-2:  oklch(91% 0.018 95);
  --color-paper-3:  oklch(87% 0.020 95);
  --color-ink:      oklch(20% 0.012 250);
  --color-ink-2:    oklch(28% 0.012 250);
  --color-muted:    oklch(46% 0.012 250);
  --color-rule:     oklch(76% 0.012 250);
  --color-rule-2:   oklch(82% 0.012 250);
  /* the six riso inks — badges and one primary accent */
  --color-mustard:  oklch(80% 0.150 88);
  --color-cerulean: oklch(60% 0.140 235);
  --color-lavender: oklch(74% 0.100 295);
  --color-vermilion:oklch(62% 0.200 32);
  --color-mint:     oklch(84% 0.110 165);
  --color-pink:     oklch(78% 0.130 350);
  --color-accent:   var(--color-cerulean);
  --color-accent-ink: var(--color-paper);
  --color-focus:    oklch(58% 0.200 235);
  --color-error:    var(--color-vermilion);
  --color-grain:    oklch(20% 0.012 250 / 0.06);   /* overlay modifier for halftone dots */

  --font-display: "DotGothic16", "IBM Plex Sans JP", sans-serif;
  --font-body:    "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-outlier: "Silkscreen", "DotGothic16", monospace;

  --text-xs: 0.64rem; --text-sm: 0.8rem; --text-base: 1rem; --text-md: 1.25rem; --text-lg: 1.5625rem;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px;
  --line: 2px;
  --page-inline: var(--space-4);   /* ページ左右の基準余白。ヘッダー・ペイン・フッターで共有 */
  --shadow: 4px 4px 0 var(--color-ink);
  --shadow-sm: 2px 2px 0 var(--color-ink);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in: cubic-bezier(0.7, 0, 0.84, 0);
  --dur-tick: 100ms; --dur-short: 180ms; --dur-mid: 260ms;
}

*, *::before, *::after { box-sizing: border-box; border-radius: 0; }
html, body { overflow-x: clip; }
html { background: var(--color-paper); color: var(--color-ink); }
body {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.55;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background-color: var(--color-paper);
  background-image: radial-gradient(var(--color-grain) 1px, transparent 1.2px);
  background-size: 6px 6px;
}
h1, h2, h3, legend { font-family: var(--font-display); font-weight: 400; font-style: normal; line-height: 1.15; margin: 0; overflow-wrap: anywhere; min-width: 0; }
button, input, select { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }
::selection { background: var(--color-mint); color: var(--color-ink); }

/* ---------- toolbar (menubar) ---------- */
.bar {
  display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap;
  padding: 10px var(--page-inline);   /* 上下: 文字インク＋下線の塊（24px）を 10px で挟む。左右: ペインの左端に揃える */
  border-bottom: var(--line) solid var(--color-ink);
  background: var(--color-paper);
}
.wordmark {
  display: flex; align-items: baseline; gap: var(--space-2);
  font-family: var(--font-outlier); font-weight: 700; font-size: var(--text-lg); letter-spacing: 0.04em;
  white-space: nowrap;
}
/* 版ズレはやめ、文字の下にセルリアンの太線（リソのベタ1色）。
   Silkscreen 25px の大文字インクは 16px。行送りを 16px に固定すると
   インクは箱の 2px 下から始まるので、margin-top で吸収し、インク下端→線まで 3px（1ドット）空ける */
.wordmark .mark {
  display: inline-block; line-height: 16px; margin-top: -2px;
  padding-bottom: 5px; border-bottom: 5px solid var(--color-cerulean);
}
.wordmark small { font-family: var(--font-display); font-size: var(--text-xs); color: var(--color-muted); letter-spacing: 0; }
.bar-status { margin: 0 0 0 auto; font-family: var(--font-display); font-size: var(--text-sm); color: var(--color-muted); white-space: nowrap; }

/* ---------- panes ---------- */
.workbench {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--space-4);
  padding: var(--space-4) var(--page-inline);
  align-content: start;
}
@media (min-width: 60rem) {
  :root { --page-inline: var(--space-6); }
  .workbench {
    grid-template-columns: minmax(0, 20rem) minmax(0, 1fr) minmax(0, 17rem);
    grid-template-areas: "search grid options" "results grid options";
    grid-template-rows: auto 1fr;
    padding: var(--space-6) var(--page-inline);
    gap: var(--space-6);
    align-items: start;
  }
  .pane-search { grid-area: search; }
  .pane-results { grid-area: results; }
  .pane-grid { grid-area: grid; }
  .pane-options { grid-area: options; }
}
.pane {
  border: var(--line) solid var(--color-ink);
  background: var(--color-paper);
  box-shadow: var(--shadow);
  min-width: 0;
}
.pane-title {
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-1) var(--space-3);
  border-bottom: var(--line) solid var(--color-ink);
  background: repeating-linear-gradient(to bottom, var(--color-ink) 0 2px, var(--color-paper) 2px 4px);
}
.pane-title h2 {
  font-size: var(--text-sm); letter-spacing: 0.04em;
  background: var(--color-paper); padding: 0 var(--space-2);
  border: var(--line) solid var(--color-ink);
}
.pane-title .count { margin-left: auto; font-family: var(--font-outlier); font-size: var(--text-xs); background: var(--color-paper); border: var(--line) solid var(--color-ink); padding: 0 var(--space-1); }
.pane-body { padding: var(--space-3); }

/* ---------- controls ---------- */
.field { display: grid; gap: var(--space-1); }
.field label, .field legend { font-family: var(--font-display); font-size: var(--text-sm); color: var(--color-ink-2); }
fieldset.field { border: 0; padding: 0; margin: 0; }
fieldset.field legend { margin-bottom: var(--space-1); padding: 0; }
.input {
  width: 100%; min-width: 0;
  padding: var(--space-2) var(--space-3);
  border: var(--line) solid var(--color-ink);
  background: var(--color-paper);
  box-shadow: inset 2px 2px 0 var(--color-paper-3);
  transition: box-shadow var(--dur-short) var(--ease-out);
}
.input::placeholder { color: var(--color-muted); }
.input:hover { box-shadow: inset 2px 2px 0 var(--color-rule-2); }
.input:focus-visible { outline-offset: 0; box-shadow: inset 2px 2px 0 var(--color-paper-3); }
.input[aria-invalid="true"] { border-color: var(--color-error); box-shadow: inset 2px 2px 0 var(--color-error); }
.input:disabled { opacity: .5; cursor: not-allowed; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: 40px; padding: var(--space-1) var(--space-4);
  border: var(--line) solid var(--color-ink);
  background: var(--color-paper); color: var(--color-ink);
  font-family: var(--font-display); font-size: var(--text-base); letter-spacing: 0.02em;
  text-decoration: none;
  white-space: nowrap; cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: transform var(--dur-tick) var(--ease-out), box-shadow var(--dur-tick) var(--ease-out), background-color var(--dur-short) var(--ease-out);
}
@media (hover: hover) and (pointer: fine) {
  .btn:hover { background: var(--color-paper-2); }
}
.btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--color-ink); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; transform: none; box-shadow: var(--shadow-sm); }
.btn-primary { background: var(--color-ink); color: var(--color-paper); box-shadow: 4px 4px 0 var(--color-cerulean); }
@media (hover: hover) and (pointer: fine) { .btn-primary:hover { background: var(--color-ink-2); } }
.btn-primary:active { box-shadow: 0 0 0 var(--color-cerulean); }
.btn[data-state="loading"] { cursor: progress; }
.btn[data-state="loading"] .label::after { content: "…"; }
.btn[data-state="loading"]::before { content: ""; width: 8px; height: 8px; background: currentColor; animation: blink 1s steps(2) infinite; }
.btn[data-state="error"] { border-color: var(--color-error); box-shadow: 2px 2px 0 var(--color-error); }
.btn[data-state="success"] { border-color: var(--color-mint); }
@keyframes blink { 50% { opacity: 0; } }
@media (pointer: coarse) { .btn { min-height: 44px; } }

.seg { display: flex; flex-wrap: wrap; border: var(--line) solid var(--color-ink); width: fit-content; max-width: 100%; min-width: 0; }
.seg label { border-bottom: var(--line) solid var(--color-ink); margin-bottom: calc(-1 * var(--line)); }
.seg label { position: relative; }
.seg input { position: absolute; inset: 0; opacity: 0; margin: 0; }
.seg span {
  display: block; padding: var(--space-1) var(--space-3);
  font-family: var(--font-display); font-size: var(--text-sm); white-space: nowrap; cursor: pointer;
  border-right: var(--line) solid var(--color-ink);
}
.seg label:last-child span { border-right: 0; }
.seg input:checked + span { background: var(--color-ink); color: var(--color-paper); }
.seg input:focus-visible + span { outline: 3px solid var(--color-focus); outline-offset: -3px; }
.seg input:disabled + span { opacity: .45; cursor: not-allowed; }

.search-form { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-3); }
.sub-form { border-top: var(--line) dashed var(--color-rule); }
.search-actions { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; }
.msg { font-size: var(--text-sm); color: var(--color-muted); margin: 0; min-height: 1.4em; overflow-wrap: anywhere; }
.msg[data-tone="error"] { color: var(--color-ink); border-left: 6px solid var(--color-error); padding-left: var(--space-2); }

/* ---------- results ---------- */
.results { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); max-height: 60dvh; overflow-y: auto; }
@media (min-width: 60rem) { .results { max-height: calc(100dvh - 24rem); } }
.result {
  display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: var(--space-3); align-items: center;
  width: 100%; padding: var(--space-2); text-align: left;
  border: var(--line) solid var(--color-ink); background: var(--color-paper); cursor: pointer;
  transition: transform var(--dur-tick) var(--ease-out), background-color var(--dur-short) var(--ease-out);
}
@media (hover: hover) and (pointer: fine) { .result:hover { background: var(--color-paper-2); transform: translateX(2px); } }
.result:active { transform: translate(1px, 1px); }
.result img { width: 56px; height: 56px; object-fit: cover; border: var(--line) solid var(--color-ink); background: var(--color-paper-2); }
.result .t { font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.result .a { font-size: var(--text-sm); color: var(--color-ink-2); overflow-wrap: anywhere; }
.result .meta { display: flex; gap: var(--space-2); align-items: baseline; flex-wrap: wrap; }
.badge {
  font-family: var(--font-outlier); font-size: var(--text-xs); letter-spacing: 0.02em; line-height: 1.6;
  padding: 0 var(--space-1); border: var(--line) solid var(--color-ink); color: var(--color-ink); white-space: nowrap;
}
.badge[data-source="itunes"]      { background: var(--color-pink); }
.badge[data-source="lastfm"]      { background: var(--color-vermilion); }
.badge[data-source="musicbrainz"] { background: var(--color-lavender); }
.badge[data-source="discogs"]     { background: var(--color-mustard); }
.badge[data-source="bandcamp"]    { background: var(--color-mint); }
.badge[data-source="manual"]      { background: var(--color-cerulean); color: var(--color-paper); }
.empty { padding: var(--space-4) var(--space-2); color: var(--color-muted); font-size: var(--text-sm); display: grid; gap: var(--space-1); }
.empty strong { font-family: var(--font-display); font-weight: 400; color: var(--color-ink); font-size: var(--text-base); }

/* ---------- grid ---------- */
.grid-head { display: grid; gap: var(--space-3); margin-bottom: var(--space-3); }
.grid {
  display: grid;
  grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
  gap: var(--space-2);
  padding: var(--space-2);
  border: var(--line) solid var(--color-ink);
  background: var(--color-ink);
  list-style: none; margin: 0;
  /* 全体が画面に収まるよう、縦マス数が多いほど横幅を絞る */
  max-width: min(100%, calc((100dvh - 22rem) * var(--cols, 3) / var(--rows, 3)));
  min-width: min(100%, 16rem);
}
.grid[data-numbers="off"] .num { display: none; }
.cell {
  position: relative; aspect-ratio: 1;
  background-color: var(--color-paper-2);
  background-image:
    linear-gradient(45deg, var(--color-paper-3) 25%, transparent 25%, transparent 75%, var(--color-paper-3) 75%),
    linear-gradient(45deg, var(--color-paper-3) 25%, transparent 25%, transparent 75%, var(--color-paper-3) 75%);
  background-size: 16px 16px; background-position: 0 0, 8px 8px;
  min-width: 0;
}
.cell img { width: 100%; height: 100%; object-fit: cover; }
.cell.is-over { outline: 4px solid var(--color-cerulean); outline-offset: -4px; }
.cell[draggable="true"] { cursor: grab; }
.cell.is-dragging { opacity: .5; }
.cell .num {
  position: absolute; left: 0; top: 0;
  font-family: var(--font-outlier); font-size: var(--text-xs); line-height: 1.6;
  padding: 0 var(--space-1); background: var(--color-paper); border-right: var(--line) solid var(--color-ink); border-bottom: var(--line) solid var(--color-ink);
}
.cell .rm {
  position: absolute; right: 0; top: 0; width: 28px; height: 28px; padding: 0;
  display: grid; place-items: center;
  font-family: var(--font-outlier); font-size: var(--text-sm); line-height: 1;
  background: var(--color-paper); border: 0; border-left: var(--line) solid var(--color-ink); border-bottom: var(--line) solid var(--color-ink);
  cursor: pointer;
}
@media (hover: hover) and (pointer: fine) { .cell .rm:hover { background: var(--color-vermilion); } }
.cell .rm:active { background: var(--color-vermilion); }
.cell .cap {
  position: absolute; inset: auto 0 0 0; padding: 2px var(--space-1);
  background: var(--color-paper); border-top: var(--line) solid var(--color-ink);
  font-size: var(--text-xs); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.grid-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }

/* ---------- options ---------- */
.opts { display: grid; gap: var(--space-4); }
.custom-size { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-2); font-size: var(--text-sm); }
.custom-size label { display: inline-flex; align-items: center; gap: var(--space-1); font-family: var(--font-display); }
.input.num { width: 4.5rem; padding: var(--space-1) var(--space-2); font-variant-numeric: tabular-nums; }
.check { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); cursor: pointer; min-height: 28px; }
.check input {
  appearance: none; width: 18px; height: 18px; margin: 0; flex: none;
  border: var(--line) solid var(--color-ink); background: var(--color-paper);
  box-shadow: inset 2px 2px 0 var(--color-paper-3);
  display: grid; place-items: center; cursor: pointer;
}
.check input:checked { background: var(--color-ink); box-shadow: none; }
.check input:checked::after { content: ""; width: 8px; height: 8px; background: var(--color-paper); }
.check input:disabled { opacity: .5; cursor: not-allowed; }
.swatches { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.swatches label { position: relative; width: 28px; height: 28px; }
.swatches input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.swatches span { display: block; width: 100%; height: 100%; border: var(--line) solid var(--color-ink); background: var(--sw); }
.swatches input:checked + span { outline: 3px solid var(--color-ink); outline-offset: 2px; }
.swatches input:focus-visible + span { outline: 3px solid var(--color-focus); outline-offset: 2px; }
.custom-color { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-2); font-family: var(--font-display); font-size: var(--text-sm); }
.custom-color input { appearance: none; width: 28px; height: 28px; padding: 0; border: var(--line) solid var(--color-ink); background: none; cursor: pointer; }
.custom-color input::-webkit-color-swatch-wrapper { padding: 0; }
.custom-color input::-webkit-color-swatch { border: 0; }
input[type="range"] { appearance: none; width: 100%; height: 24px; background: transparent; margin: 0; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: var(--line); background: var(--color-ink); }
input[type="range"]::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; margin-top: -7px; background: var(--color-ink); border: var(--line) solid var(--color-ink); box-shadow: inset 0 0 0 3px var(--color-paper); }
input[type="range"]:focus-visible { outline-offset: 4px; }
output { font-variant-numeric: tabular-nums; }

/* ---------- output ---------- */
.output { display: grid; gap: var(--space-3); margin-top: var(--space-4); padding-top: var(--space-4); border-top: var(--line) solid var(--color-rule); }
.output[hidden] { display: none; }
.output img { width: auto; max-width: 100%; max-height: 70dvh; border: var(--line) solid var(--color-ink); box-shadow: var(--shadow); }
.output .dl { justify-self: start; }
.spec { display: grid; gap: var(--space-2); font-size: var(--text-sm); color: var(--color-ink-2); margin: 0; }
.spec dt { font-family: var(--font-display); color: var(--color-muted); }
.spec dd { margin: 0; font-variant-numeric: tabular-nums; }

footer { padding: var(--space-3) var(--page-inline); border-top: var(--line) solid var(--color-ink); font-family: var(--font-display); font-size: var(--text-sm); color: var(--color-muted); display: flex; gap: var(--space-4); flex-wrap: wrap; }
footer a { color: var(--color-ink); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
}
</style>
</head>
<body>

<header class="bar">
  <h1 class="wordmark"><span class="mark">TRACKMENTO</span> <small>local</small></h1>
  <p class="bar-status" id="bar-status" aria-live="polite">起動中</p>
</header>

<main class="workbench">

  <section class="pane pane-search" aria-labelledby="h-search">
    <div class="pane-title"><h2 id="h-search">検索</h2></div>
    <form class="pane-body search-form" id="search-form" novalidate>
      <div class="field">
        <label for="q">曲名</label>
        <input class="input" id="q" name="q" type="search" autocomplete="off" placeholder="例: Pretender" enterkeyhint="search">
      </div>
      <div class="field">
        <label for="artist">アーティスト名</label>
        <input class="input" id="artist" name="artist" type="search" autocomplete="off" placeholder="例: Official髭男dism" enterkeyhint="search">
      </div>
      <fieldset class="field">
        <legend>ソース</legend>
        <div class="seg" id="sources" role="radiogroup" aria-label="検索ソース"></div>
      </fieldset>
      <div class="search-actions">
        <button class="btn btn-primary" type="submit" id="search-btn"><span class="label">検索する</span></button>
        <p class="msg" id="search-msg" role="status" aria-live="polite"></p>
      </div>
    </form>
    <form class="pane-body search-form sub-form" id="bandcamp-form" novalidate>
      <div class="field">
        <label for="bc-url">Bandcamp の URL（トラック／アルバムページ）</label>
        <input class="input" id="bc-url" name="url" type="url" inputmode="url" autocomplete="off" placeholder="https://xxx.bandcamp.com/track/…">
      </div>
      <div class="search-actions">
        <button class="btn" type="submit" id="bc-btn"><span class="label">URL から取る</span></button>
        <p class="msg" id="bc-msg" role="status" aria-live="polite"></p>
      </div>
    </form>
    <form class="pane-body search-form sub-form" id="manual-form" novalidate>
      <div class="field">
        <label for="m-image">手入力: ジャケット画像の URL</label>
        <input class="input" id="m-image" name="image" type="url" inputmode="url" autocomplete="off" placeholder="https://…/cover.jpg">
      </div>
      <div class="field">
        <label for="m-title">曲名</label>
        <input class="input" id="m-title" name="title" type="text" autocomplete="off">
      </div>
      <div class="field">
        <label for="m-artist">アーティスト名</label>
        <input class="input" id="m-artist" name="artist" type="text" autocomplete="off">
      </div>
      <div class="search-actions">
        <button class="btn" type="submit" id="m-btn"><span class="label">手入力で追加</span></button>
        <p class="msg" id="m-msg" role="status" aria-live="polite"></p>
      </div>
    </form>
  </section>

  <section class="pane pane-results" aria-labelledby="h-results">
    <div class="pane-title"><h2 id="h-results">候補</h2><span class="count" id="results-count" aria-label="候補数">0</span></div>
    <div class="pane-body">
      <ul class="results" id="results">
        <li class="empty"><strong>まだ候補がありません</strong><span>曲名かアーティスト名を入れて検索すると、ここにジャケット付きで並びます。</span><span>クリックで次の空きマスに入ります。</span></li>
      </ul>
    </div>
  </section>

  <section class="pane pane-grid" aria-labelledby="h-grid">
    <div class="pane-title"><h2 id="h-grid">グリッド <span id="grid-size-label">3×3</span></h2><span class="count" id="grid-count" aria-label="配置数">0/9</span></div>
    <div class="pane-body">
      <div class="grid-head">
        <div class="field">
          <label for="title">タイトル（省略可）</label>
          <input class="input" id="title" type="text" placeholder="例: 私を構成する9曲" maxlength="60">
        </div>
      </div>
      <ol class="grid" id="grid" aria-label="ジャケットの並び" style="--cols:3;--rows:3"></ol>
      <p class="msg" id="grid-msg" role="status" aria-live="polite">候補をクリックすると入ります。マスをドラッグすると入れ替え。</p>
      <div class="grid-actions">
        <button class="btn btn-primary" type="button" id="render-btn"><span class="label">画像を作る</span></button>
        <button class="btn" type="button" id="clear-btn">全部クリア</button>
        <button class="btn" type="button" id="export-btn">JSON 書き出し</button>
        <button class="btn" type="button" id="import-btn">JSON 読み込み</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
        <button class="btn" type="button" id="server-render-btn" title="サーバー（Pillow）で描いて outputs/ に保存し、URL を得る">サーバーで作る（URL）</button>
        <button class="btn" type="button" id="reload-btn" title="CLI で更新した grids/default.json を読み直す">サーバーから読み直す</button>
      </div>
      <div class="output" id="output" hidden>
        <img id="output-img" alt="生成したグリッド画像のプレビュー">
        <p class="msg" id="output-url" hidden></p>
        <a class="btn dl" id="download" download="trackmento.png" href="#">PNG を保存</a>
      </div>
    </div>
  </section>

  <aside class="pane pane-options" aria-labelledby="h-options">
    <div class="pane-title"><h2 id="h-options">出力オプション</h2></div>
    <div class="pane-body opts">
      <fieldset class="field">
        <legend>グリッド（横 × 縦）</legend>
        <div class="seg" id="size-seg" role="radiogroup" aria-label="グリッドサイズ">
          <label><input type="radio" name="size" value="3x3" checked><span>3×3</span></label>
          <label><input type="radio" name="size" value="4x6"><span>4×6</span></label>
          <label><input type="radio" name="size" value="3x8"><span>3×8</span></label>
          <label><input type="radio" name="size" value="5x5"><span>5×5</span></label>
          <label><input type="radio" name="size" value="custom"><span>任意</span></label>
        </div>
        <div class="custom-size" id="custom-size" hidden>
          <label>横 <input class="input num" id="cols" type="number" inputmode="numeric" min="1" max="12" value="3" aria-label="横のマス数"></label>
          <span aria-hidden="true">×</span>
          <label>縦 <input class="input num" id="rows" type="number" inputmode="numeric" min="1" max="12" value="3" aria-label="縦のマス数"></label>
        </div>
      </fieldset>

      <fieldset class="field">
        <legend>比率</legend>
        <div class="seg" id="ratio-seg" role="radiogroup" aria-label="出力比率">
          <label><input type="radio" name="ratio" value="1:1" checked><span>1:1</span></label>
          <label><input type="radio" name="ratio" value="16:9"><span>16:9 X</span></label>
          <label><input type="radio" name="ratio" value="4:5"><span>4:5 投稿</span></label>
          <label><input type="radio" name="ratio" value="9:16"><span>9:16 ストーリーズ</span></label>
          <label><input type="radio" name="ratio" value="free"><span>なし</span></label>
        </div>
      </fieldset>

      <fieldset class="field">
        <legend>表示</legend>
        <label class="check"><input type="checkbox" id="opt-title" checked><span>タイトル</span></label>
        <label class="check"><input type="checkbox" id="opt-sidebar"><span>曲名リスト（サイドバー）</span></label>
        <label class="check"><input type="checkbox" id="opt-numbers" checked><span>番号バッジ</span></label>
      </fieldset>

      <fieldset class="field">
        <legend>背景色</legend>
        <div class="swatches" id="swatches" role="radiogroup" aria-label="背景色"></div>
        <label class="custom-color">好きな色 <input type="color" id="bg-custom" value="#f2efe6" aria-label="背景色を自由に指定"></label>
      </fieldset>

      <div class="field">
        <label for="margin">余白 <output id="margin-out" for="margin">48</output> px</label>
        <input type="range" id="margin" min="0" max="160" step="8" value="48">
      </div>

      <dl class="spec">
        <dt>出力サイズ</dt><dd id="spec-out">—</dd>
        <dt>マスの大きさ</dt><dd id="spec-cell">600 px</dd>
      </dl>
    </div>
  </aside>

</main>

<footer>
  <span>TRACKMENTO</span>
  <a href="/health">/health</a>
  <span id="foot-sources"></span>
</footer>

<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const SOURCE_LABEL = { itunes: "iTunes", lastfm: "Last.fm", musicbrainz: "MusicBrainz", discogs: "Discogs", bandcamp: "Bandcamp", manual: "手入力" };
  const ALL_SOURCES = ["itunes", "lastfm", "musicbrainz", "discogs"];
  const CELL_PX = 600, GAP_PX = 12, MAX_SIDE = 8000;
  const RATIOS = { "1:1": 1, "16:9": 16 / 9, "4:5": 4 / 5, "9:16": 9 / 16, free: null };
  const SWATCHES = [
    ["paper", "クリーム"], ["ink", "黒"], ["mustard", "マスタード"], ["cerulean", "セルリアン"],
    ["lavender", "ラベンダー"], ["vermilion", "朱赤"], ["mint", "ミント"], ["pink", "ピンク"],
  ];

  const state = {
    cols: 3, rows: 3, title: "", cells: Array(9).fill(null), stash: [],
    ratio: "1:1", showTitle: true, sidebar: false, numbers: true, bg: "paper", bgCustom: null, margin: 48,
  };
  let available = [];
  let dragFrom = null;

  const els = {
    status: $("#bar-status"), form: $("#search-form"), q: $("#q"), artist: $("#artist"),
    sources: $("#sources"), searchBtn: $("#search-btn"), searchMsg: $("#search-msg"),
    bcForm: $("#bandcamp-form"), bcUrl: $("#bc-url"), bcBtn: $("#bc-btn"), bcMsg: $("#bc-msg"),
    mForm: $("#manual-form"), mImage: $("#m-image"), mTitle: $("#m-title"), mArtist: $("#m-artist"), mBtn: $("#m-btn"), mMsg: $("#m-msg"),
    exportBtn: $("#export-btn"), importBtn: $("#import-btn"), importFile: $("#import-file"),
    serverRenderBtn: $("#server-render-btn"), reloadBtn: $("#reload-btn"), outputUrl: $("#output-url"),
    results: $("#results"), resultsCount: $("#results-count"),
    grid: $("#grid"), gridCount: $("#grid-count"), gridMsg: $("#grid-msg"), title: $("#title"), gridSizeLabel: $("#grid-size-label"),
    renderBtn: $("#render-btn"), clearBtn: $("#clear-btn"),
    output: $("#output"), outputImg: $("#output-img"), download: $("#download"), footSources: $("#foot-sources"),
    sizeSeg: $("#size-seg"), customSize: $("#custom-size"), cols: $("#cols"), rows: $("#rows"),
    ratioSeg: $("#ratio-seg"), optTitle: $("#opt-title"), optSidebar: $("#opt-sidebar"), optNumbers: $("#opt-numbers"),
    swatches: $("#swatches"), bgCustom: $("#bg-custom"), margin: $("#margin"), marginOut: $("#margin-out"),
    specOut: $("#spec-out"), specCell: $("#spec-cell"),
  };

  const proxied = (url) => `/image-proxy?url=${encodeURIComponent(url)}`;
  const setBtnState = (btn, s) => { if (s) btn.dataset.state = s; else delete btn.dataset.state; btn.disabled = s === "loading"; };
  const say = (el, text, tone) => { el.textContent = text; if (tone) el.dataset.tone = tone; else delete el.dataset.tone; };

  /* ---- sources ---- */
  async function loadHealth() {
    try {
      const r = await fetch("/health");
      const d = await r.json();
      available = d.sources || [];
      els.status.textContent = "接続OK";
      els.footSources.textContent = `ソース: ${available.map(s => SOURCE_LABEL[s] || s).join(" / ")}`;
    } catch {
      available = [];
      els.status.textContent = "サーバーに接続できません";
    }
    renderSources();
  }
  function renderSources() {
    els.sources.innerHTML = "";
    const opts = [];
    if (available.length > 1) opts.push({ v: "", label: "横断", on: true });
    for (const s of ALL_SOURCES) opts.push({ v: s, label: SOURCE_LABEL[s], on: available.includes(s) });
    let checked = false;
    for (const o of opts) {
      const l = document.createElement("label");
      const i = document.createElement("input");
      i.type = "radio"; i.name = "source"; i.value = o.v; i.disabled = !o.on;
      if (o.on && !checked) { i.checked = true; checked = true; }
      const sp = document.createElement("span"); sp.textContent = o.label;
      if (!o.on) l.title = "未実装";
      l.append(i, sp); els.sources.append(l);
    }
  }

  /* ---- search ---- */
  els.form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = els.q.value.trim(), artist = els.artist.value.trim();
    els.q.removeAttribute("aria-invalid");
    if (!q && !artist) { els.q.setAttribute("aria-invalid", "true"); say(els.searchMsg, "曲名かアーティスト名のどちらかは必要です。", "error"); els.q.focus({ preventScroll: true }); return; }
    const source = new FormData(els.form).get("source") || "";
    const params = new URLSearchParams({ q, artist });
    if (source) params.set("source", source);
    setBtnState(els.searchBtn, "loading"); say(els.searchMsg, "");
    try {
      const r = await fetch(`/search?${params}`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const tracks = await r.json();
      renderResults(tracks);
      setBtnState(els.searchBtn, null);
      say(els.searchMsg, tracks.length ? `${tracks.length} 件` : "見つかりませんでした。表記を変えるか、別のソースを試してください。");
    } catch (err) {
      setBtnState(els.searchBtn, "error");
      say(els.searchMsg, `検索に失敗しました（${err.message}）。サーバーが起動しているか確認して、もう一度押してください。`, "error");
      setTimeout(() => setBtnState(els.searchBtn, null), 2500);
    }
  });

  /* ---- bandcamp URL ---- */
  els.bcForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const url = els.bcUrl.value.trim();
    els.bcUrl.removeAttribute("aria-invalid");
    if (!/^https?:\/\//.test(url)) { els.bcUrl.setAttribute("aria-invalid", "true"); say(els.bcMsg, "https:// から始まる Bandcamp のページ URL を貼ってください。", "error"); els.bcUrl.focus({ preventScroll: true }); return; }
    setBtnState(els.bcBtn, "loading"); say(els.bcMsg, "");
    try {
      const r = await fetch("/bandcamp", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ url }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || `HTTP ${r.status}`);
      currentResults = [d, ...currentResults.filter(t => t.image !== d.image)];
      renderResults(currentResults);
      els.bcUrl.value = "";
      setBtnState(els.bcBtn, null);
      say(els.bcMsg, `候補の先頭に「${d.title}」を入れました。クリックで配置します。`);
    } catch (err) {
      setBtnState(els.bcBtn, "error");
      say(els.bcMsg, `取れませんでした。${err.message}`, "error");
      setTimeout(() => setBtnState(els.bcBtn, null), 2500);
    }
  });

  /* ---- manual entry ---- */
  els.mForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const image = els.mImage.value.trim(), title = els.mTitle.value.trim(), artist = els.mArtist.value.trim();
    for (const el of [els.mImage, els.mTitle]) el.removeAttribute("aria-invalid");
    if (!/^https?:\/\//.test(image)) { els.mImage.setAttribute("aria-invalid", "true"); say(els.mMsg, "画像の URL は https:// から始まる必要があります。", "error"); els.mImage.focus({ preventScroll: true }); return; }
    if (!title) { els.mTitle.setAttribute("aria-invalid", "true"); say(els.mMsg, "曲名を入れてください。", "error"); els.mTitle.focus({ preventScroll: true }); return; }
    const t = { source: "manual", title, artist, album: null, image, thumb: image, external_url: null };
    currentResults = [t, ...currentResults.filter(x => x.image !== image)];
    renderResults(currentResults);
    els.mImage.value = ""; els.mTitle.value = ""; els.mArtist.value = "";
    say(els.mMsg, `候補の先頭に「${title}」を入れました。クリックで配置します。`);
  });

  let currentResults = [];
  function renderResults(tracks) {
    currentResults = tracks;
    els.results.innerHTML = "";
    els.resultsCount.textContent = String(tracks.length);
    if (!tracks.length) {
      const li = document.createElement("li"); li.className = "empty";
      li.innerHTML = "<strong>該当なし</strong><span>曲名を短くする、アーティスト名だけで検索する、などを試してください。</span>";
      els.results.append(li);
      return;
    }
    for (const t of tracks) {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button"; b.className = "result";
      b.setAttribute("aria-label", `${t.title} / ${t.artist} をグリッドに追加`);
      const img = document.createElement("img");
      img.src = proxied(t.thumb || t.image); img.alt = ""; img.loading = "lazy"; img.width = 56; img.height = 56;
      const box = document.createElement("div");
      const tt = document.createElement("div"); tt.className = "t"; tt.textContent = t.title;
      const meta = document.createElement("div"); meta.className = "meta";
      const a = document.createElement("span"); a.className = "a"; a.textContent = t.artist + (t.album ? ` · ${t.album}` : "");
      const badge = document.createElement("span"); badge.className = "badge"; badge.dataset.source = t.source; badge.textContent = SOURCE_LABEL[t.source] || t.source;
      meta.append(badge, a); box.append(tt, meta); b.append(img, box); li.append(b);
      b.addEventListener("click", () => addTrack(t));
      els.results.append(li);
    }
  }

  /* ---- grid ---- */
  function addTrack(t) {
    const i = state.cells.findIndex(c => c === null);
    if (i < 0) { say(els.gridMsg, "空きマスがありません。× で外してから追加してください。", "error"); return; }
    state.cells[i] = t;
    renderGrid();
    say(els.gridMsg, `${i + 1} 番に「${t.title}」を入れました。`);
  }
  function removeAt(i) {
    const t = state.cells[i]; state.cells[i] = null; renderGrid();
    if (t) say(els.gridMsg, `${i + 1} 番の「${t.title}」を外しました。`);
  }
  function swap(a, b) {
    if (a === b) return;
    [state.cells[a], state.cells[b]] = [state.cells[b], state.cells[a]];
    renderGrid(); say(els.gridMsg, `${a + 1} 番と ${b + 1} 番を入れ替えました。`);
  }
  function resizeGrid(cols, rows) {
    cols = Math.min(12, Math.max(1, cols | 0)); rows = Math.min(12, Math.max(1, rows | 0));
    const n = cols * rows, cur = state.cells.length;
    if (n < cur) {
      // 溢れた曲は退避。サイズを戻すと復帰する
      const cut = state.cells.slice(n).filter(Boolean);
      state.stash = cut.concat(state.stash);
      state.cells = state.cells.slice(0, n);
      if (cut.length) say(els.gridMsg, `${cut.length} 曲をいったん外しました。サイズを戻すと復帰します。`);
    } else if (n > cur) {
      const add = [];
      while (add.length < n - cur) add.push(state.stash.length ? state.stash.shift() : null);
      state.cells = state.cells.concat(add);
    }
    state.cols = cols; state.rows = rows;
    els.cols.value = cols; els.rows.value = rows;
    renderGrid();
  }
  function renderGrid() {
    els.grid.style.setProperty("--cols", state.cols);
    els.grid.style.setProperty("--rows", state.rows);
    els.grid.dataset.numbers = state.numbers ? "on" : "off";
    els.gridSizeLabel.textContent = `${state.cols}×${state.rows}`;
    els.grid.innerHTML = "";
    state.cells.forEach((t, i) => {
      const li = document.createElement("li");
      li.className = "cell"; li.dataset.index = i;
      const num = document.createElement("span"); num.className = "num"; num.textContent = String(i + 1).padStart(2, "0");
      li.append(num);
      if (t) {
        li.draggable = true;
        li.setAttribute("aria-label", `${i + 1} 番: ${t.title} / ${t.artist}`);
        const img = document.createElement("img"); img.src = proxied(t.image); img.alt = ""; img.draggable = false;
        const rm = document.createElement("button"); rm.type = "button"; rm.className = "rm"; rm.textContent = "×"; rm.setAttribute("aria-label", `${i + 1} 番の ${t.title} を外す`);
        rm.addEventListener("click", (e) => { e.stopPropagation(); removeAt(i); });
        const cap = document.createElement("span"); cap.className = "cap"; cap.textContent = `${t.title} / ${t.artist}`;
        li.append(img, rm, cap);
      } else {
        li.setAttribute("aria-label", `${i + 1} 番: 空`);
      }
      li.addEventListener("dragstart", (e) => { dragFrom = i; li.classList.add("is-dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", String(i)); });
      li.addEventListener("dragend", () => { dragFrom = null; li.classList.remove("is-dragging"); });
      li.addEventListener("dragover", (e) => { if (dragFrom === null) return; e.preventDefault(); e.dataTransfer.dropEffect = "move"; li.classList.add("is-over"); });
      li.addEventListener("dragleave", () => li.classList.remove("is-over"));
      li.addEventListener("drop", (e) => { e.preventDefault(); li.classList.remove("is-over"); const from = Number(e.dataTransfer.getData("text/plain")); if (Number.isInteger(from)) swap(from, i); });
      els.grid.append(li);
    });
    const n = state.cells.filter(Boolean).length;
    els.gridCount.textContent = `${n}/${state.cells.length}`;
    els.renderBtn.disabled = n === 0;
    updateSpec();
  }
  els.clearBtn.addEventListener("click", () => {
    if (!state.cells.some(Boolean) && !state.stash.length) return;
    state.cells.fill(null); state.stash = []; renderGrid(); els.output.hidden = true; say(els.gridMsg, "全部外しました。");
  });
  els.title.addEventListener("input", () => { state.title = els.title.value; updateSpec(); });

  /* ---- options ---- */
  els.sizeSeg.addEventListener("change", () => {
    const picked = els.sizeSeg.querySelector("input:checked").value;
    els.customSize.hidden = picked !== "custom";
    if (picked !== "custom") { const [c, r] = picked.split("x").map(Number); resizeGrid(c, r); }
    else resizeGrid(Number(els.cols.value), Number(els.rows.value));
  });
  for (const inp of [els.cols, els.rows]) inp.addEventListener("change", () => resizeGrid(Number(els.cols.value), Number(els.rows.value)));
  els.ratioSeg.addEventListener("change", () => { state.ratio = els.ratioSeg.querySelector("input:checked").value; updateSpec(); });
  els.optTitle.addEventListener("change", () => { state.showTitle = els.optTitle.checked; els.title.disabled = !state.showTitle; updateSpec(); });
  els.optSidebar.addEventListener("change", () => { state.sidebar = els.optSidebar.checked; updateSpec(); });
  els.optNumbers.addEventListener("change", () => { state.numbers = els.optNumbers.checked; renderGrid(); });
  els.margin.addEventListener("input", () => { state.margin = Number(els.margin.value); els.marginOut.value = state.margin; updateSpec(); });
  els.bgCustom.addEventListener("input", () => {
    state.bg = "custom"; state.bgCustom = els.bgCustom.value;
    for (const i of els.swatches.querySelectorAll("input")) i.checked = false;
    updateSpec();
  });
  function renderSwatches() {
    els.swatches.innerHTML = "";
    for (const [key, label] of SWATCHES) {
      const l = document.createElement("label"); l.title = label;
      const i = document.createElement("input"); i.type = "radio"; i.name = "bg"; i.value = key; i.checked = key === state.bg; i.setAttribute("aria-label", label);
      const sp = document.createElement("span"); sp.style.setProperty("--sw", `var(--color-${key})`);
      i.addEventListener("change", () => { state.bg = key; updateSpec(); });
      l.append(i, sp); els.swatches.append(l);
    }
  }

  /* ---- colour helpers (CSS 変数 → 実 RGB) ---- */
  const probe = document.createElement("canvas").getContext("2d", { willReadFrequently: true });
  function toRGB(cssColor) {
    probe.fillStyle = "#000"; probe.fillStyle = cssColor; probe.clearRect(0, 0, 1, 1); probe.fillRect(0, 0, 1, 1);
    const [r, g, b] = probe.getImageData(0, 0, 1, 1).data; return [r, g, b];
  }
  const token = (name) => getComputedStyle(document.documentElement).getPropertyValue(`--color-${name}`).trim();
  function bgColor() { return state.bg === "custom" ? state.bgCustom : token(state.bg); }
  function isLight(cssColor) { const [r, g, b] = toRGB(cssColor); return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 > 0.55; }

  /* ---- render (Canvas) ---- */
  function loadImage(url) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = () => rej(new Error("画像の取得に失敗"));
      img.src = proxied(url);
    });
  }
  function drawCover(ctx, img, x, y, w, h) {
    const s = Math.max(w / img.naturalWidth, h / img.naturalHeight);
    const sw = w / s, sh = h / s, sx = (img.naturalWidth - sw) / 2, sy = (img.naturalHeight - sh) / 2;
    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  }
  function ellipsize(ctx, text, maxW) {
    if (ctx.measureText(text).width <= maxW) return text;
    let lo = 0, hi = text.length;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (ctx.measureText(text.slice(0, mid) + "…").width <= maxW) lo = mid; else hi = mid - 1; }
    return text.slice(0, lo) + "…";
  }

  /* レイアウト計算。描画せずにサイズだけ求める（右ペインの「出力サイズ」表示にも使う） */
  function layout() {
    const { cols, rows } = state;
    const m = state.margin;
    const title = state.showTitle ? state.title.trim() : "";
    const n = state.cells.length;
    const gw = cols * CELL_PX + (cols - 1) * GAP_PX, gh = rows * CELL_PX + (rows - 1) * GAP_PX;
    const titleSize = Math.round(Math.min(96, Math.max(48, gw * 0.045)));
    const titleH = title ? Math.round(titleSize * 1.9) : 0;
    const ratio = RATIOS[state.ratio];
    // サイドバー: 横長・正方形なら右、縦長ならグリッドの下
    const side = state.sidebar ? (ratio === null || ratio >= 1 ? "right" : "bottom") : "none";
    const lineH = side === "right"
      ? Math.max(30, Math.min(84, Math.floor(gh / n)))
      : Math.round(Math.max(48, Math.min(96, gw * 0.045)));
    const fontS = Math.round(lineH * 0.5);
    let sbW = 0, sbH = 0, sbCols = 1;
    if (side === "right") { sbW = Math.max(720, Math.round(gw * 0.5)); sbH = gh; }
    if (side === "bottom") { sbCols = n > 12 ? 2 : 1; sbW = gw; sbH = Math.ceil(n / sbCols) * lineH; }
    const sbGap = side === "none" ? 0 : GAP_PX * 4;
    const contentW = side === "right" ? gw + sbGap + sbW : gw;
    const contentH = titleH + gh + (side === "bottom" ? sbGap + sbH : 0);
    let W = contentW + m * 2, H = contentH + m * 2;
    if (ratio !== null) { if (W / H < ratio) W = Math.round(H * ratio); else H = Math.round(W / ratio); }
    const scale = Math.min(1, MAX_SIDE / Math.max(W, H));
    const ox = Math.round((W - contentW) / 2), oy = Math.round((H - contentH) / 2);
    return { W, H, scale, ox, oy, gw, gh, title, titleSize, titleH, side, sbW, sbH, sbCols, lineH, fontS, sbGap };
  }
  function updateSpec() {
    const L = layout();
    els.specOut.textContent = `${Math.round(L.W * L.scale)} × ${Math.round(L.H * L.scale)} px`;
    els.specCell.textContent = `${Math.round(CELL_PX * L.scale)} px`;
    save();
  }

  /* ---- persistence: localStorage + JSON ----
     形式は CLI と共有する grids/<name>.json と同じにする */
  const STORAGE_KEY = "trackmento:grid:default";
  const isTrack = (t) => !!t && typeof t === "object" && typeof t.image === "string" && typeof t.title === "string";
  function serialize() {
    return {
      app: "trackmento", version: 1, name: "default", savedAt: new Date().toISOString(),
      title: state.title, cols: state.cols, rows: state.rows, cells: state.cells, stash: state.stash,
      options: { ratio: state.ratio, showTitle: state.showTitle, sidebar: state.sidebar, numbers: state.numbers, bg: state.bg, bgCustom: state.bgCustom, margin: state.margin },
    };
  }
  function applyData(d) {
    if (!d || typeof d !== "object" || !Array.isArray(d.cells)) throw new Error("TRACKMENTO の JSON ではありません（cells がありません）。");
    const clamp = (v, lo, hi, dflt) => Number.isFinite(+v) ? Math.min(hi, Math.max(lo, Math.round(+v))) : dflt;
    const cols = clamp(d.cols, 1, 12, 3), rows = clamp(d.rows, 1, 12, 3);
    const cells = d.cells.slice(0, cols * rows).map(t => (isTrack(t) ? t : null));
    while (cells.length < cols * rows) cells.push(null);
    state.cols = cols; state.rows = rows; state.cells = cells;
    state.stash = Array.isArray(d.stash) ? d.stash.filter(isTrack) : [];
    state.title = typeof d.title === "string" ? d.title.slice(0, 60) : "";
    const o = d.options || {};
    state.ratio = o.ratio in RATIOS ? o.ratio : "1:1";
    state.showTitle = o.showTitle !== false; state.sidebar = o.sidebar === true; state.numbers = o.numbers !== false;
    const bgKeys = SWATCHES.map(s => s[0]);
    if (o.bg === "custom" && /^#[0-9a-f]{6}$/i.test(o.bgCustom || "")) { state.bg = "custom"; state.bgCustom = o.bgCustom; }
    else { state.bg = bgKeys.includes(o.bg) ? o.bg : "paper"; }
    state.margin = clamp(o.margin, 0, 160, 48);
    syncControls();
    renderGrid();
  }
  function syncControls() {
    els.title.value = state.title; els.title.disabled = !state.showTitle;
    const preset = els.sizeSeg.querySelector(`input[value="${state.cols}x${state.rows}"]`);
    (preset || els.sizeSeg.querySelector('input[value="custom"]')).checked = true;
    els.customSize.hidden = !!preset;
    els.cols.value = state.cols; els.rows.value = state.rows;
    els.ratioSeg.querySelector(`input[value="${state.ratio}"]`).checked = true;
    els.optTitle.checked = state.showTitle; els.optSidebar.checked = state.sidebar; els.optNumbers.checked = state.numbers;
    for (const i of els.swatches.querySelectorAll("input")) i.checked = i.value === state.bg;
    if (state.bg === "custom" && state.bgCustom) els.bgCustom.value = state.bgCustom;
    els.margin.value = state.margin; els.marginOut.value = state.margin;
  }
  /* 保存先は 2 つ。localStorage（即時）と grids/default.json（サーバー。CLI と共有）。
     サーバーへは内容が変わったときだけ PUT する（savedAt を除いて比較） */
  const GRID_NAME = "default";
  const GRID_URL = `/grids/${GRID_NAME}`;
  const signature = (d) => JSON.stringify({ ...d, savedAt: null });
  let saveTimer = null, pushTimer = null, lastPushed = null, ready = false;
  function save() {
    if (!ready) return;   // 復元が終わる前の描画で空のグリッドを保存してしまわないように
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      const d = serialize();
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch { /* 容量超過や無効化は無視 */ }
      schedulePush(d);
    }, 150);
  }
  function schedulePush(d) {
    clearTimeout(pushTimer);
    pushTimer = setTimeout(() => pushNow(d), 600);
  }
  async function pushNow(d = serialize()) {
    clearTimeout(pushTimer);
    const sig = signature(d);
    if (sig === lastPushed) return true;
    try {
      const r = await fetch(GRID_URL, { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(d) });
      if (r.ok) { lastPushed = sig; return true; }
    } catch { /* サーバー停止中は localStorage だけ */ }
    return false;
  }
  async function fetchServerGrid() {
    try {
      const r = await fetch(GRID_URL, { cache: "no-store" });
      if (r.status === 404) return null;
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return await r.json();
    } catch { return null; }
  }
  /* 起動時: localStorage とサーバーの新しい方を採用する */
  async function restore() {
    let local = null;
    try { local = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); } catch { local = null; }
    const server = await fetchServerGrid();
    const ts = (d) => (d && d.savedAt ? Date.parse(d.savedAt) || 0 : 0);
    const pick = server && (!local || ts(server) > ts(local)) ? server : local;
    if (!pick) return false;
    try {
      if (pick === server) lastPushed = signature(server);
      applyData(pick);
      if (pick === server && local) say(els.gridMsg, "サーバー側の保存（CLI など）の方が新しいので、そちらを読み込みました。");
      return true;
    } catch { return false; }
  }
  els.reloadBtn.addEventListener("click", async () => {
    setBtnState(els.reloadBtn, "loading");
    const server = await fetchServerGrid();
    setBtnState(els.reloadBtn, null);
    if (!server) { say(els.gridMsg, "サーバーにまだ保存されたグリッドがありません。", "error"); return; }
    try {
      lastPushed = signature(server);
      applyData(server);
      els.output.hidden = true;
      say(els.gridMsg, `サーバーから読み直しました（${state.cells.filter(Boolean).length} 曲）。`);
    } catch (err) { say(els.gridMsg, `読み直せませんでした。${err.message}`, "error"); }
  });
  els.exportBtn.addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(serialize(), null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = (state.title.trim() || "trackmento").replace(/[\\/:*?"<>|]/g, "_") + ".json";
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    say(els.gridMsg, `「${a.download}」を書き出しました。`);
  });
  els.importBtn.addEventListener("click", () => els.importFile.click());
  els.importFile.addEventListener("change", async () => {
    const f = els.importFile.files[0];
    if (!f) return;
    try {
      applyData(JSON.parse(await f.text()));
      els.output.hidden = true;
      say(els.gridMsg, `「${f.name}」を読み込みました（${state.cells.filter(Boolean).length} 曲）。`);
    } catch (err) {
      say(els.gridMsg, `読み込めませんでした。${err.message}`, "error");
    }
    els.importFile.value = "";
  });

  /* サーバー（Pillow）で描く。CLI の render と同じ結果になる。URL は LAN 内のスマホから開ける */
  els.serverRenderBtn.addEventListener("click", async () => {
    if (!state.cells.some(Boolean)) { say(els.gridMsg, "曲を置いてから押してください。", "error"); return; }
    setBtnState(els.serverRenderBtn, "loading"); say(els.gridMsg, "");
    try {
      clearTimeout(saveTimer);
      if (!(await pushNow())) throw new Error("サーバーに保存できませんでした");
      const r = await fetch("/render", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ grid: GRID_NAME }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || `HTTP ${r.status}`);
      if (els.download.href.startsWith("blob:")) URL.revokeObjectURL(els.download.href);
      els.outputImg.src = `/outputs/${d.file}`;
      els.download.href = `/outputs/${d.file}`; els.download.download = d.file;
      els.outputUrl.innerHTML = ""; const a = document.createElement("a"); a.href = d.url; a.textContent = d.url; a.target = "_blank"; a.rel = "noopener";
      els.outputUrl.append("URL: ", a); els.outputUrl.hidden = false;
      els.output.hidden = false;
      setBtnState(els.serverRenderBtn, null);
      say(els.gridMsg, `サーバーで ${d.width} × ${d.height} px の PNG を作りました。`);
      els.download.focus({ preventScroll: true });
    } catch (err) {
      setBtnState(els.serverRenderBtn, "error");
      say(els.gridMsg, `サーバーで作れませんでした（${err.message}）。`, "error");
      setTimeout(() => setBtnState(els.serverRenderBtn, null), 2500);
    }
  });

  els.renderBtn.addEventListener("click", async () => {
    const bg = bgColor();
    const light = isLight(bg);
    const ink = light ? token("ink") : token("paper");
    const badgeBg = light ? token("paper") : token("ink");
    const muted = light ? token("muted") : token("rule");
    setBtnState(els.renderBtn, "loading"); say(els.gridMsg, "");
    try {
      const L = layout();
      // 同梱フォントを読み込んでから描く。読めなかったときは代替フォントで書き出し、その旨を伝える
      await Promise.allSettled([
        document.fonts.load(`700 ${L.titleSize}px "IBM Plex Sans JP"`),
        document.fonts.load(`400 ${L.fontS}px "IBM Plex Sans JP"`),
        document.fonts.load(`700 20px "Silkscreen"`),
      ]);
      const jpFontOK = document.fonts.check(`700 ${L.titleSize}px "IBM Plex Sans JP"`) && document.fonts.check(`400 ${L.fontS}px "IBM Plex Sans JP"`);
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(L.W * L.scale); canvas.height = Math.round(L.H * L.scale);
      const ctx = canvas.getContext("2d");
      ctx.scale(L.scale, L.scale);
      ctx.imageSmoothingQuality = "high";
      ctx.fillStyle = bg; ctx.fillRect(0, 0, L.W, L.H);

      // タイトル
      let y0 = L.oy;
      if (L.title) {
        ctx.fillStyle = ink; ctx.font = `700 ${L.titleSize}px "IBM Plex Sans JP", sans-serif`; ctx.textBaseline = "middle"; ctx.textAlign = "left";
        ctx.fillText(ellipsize(ctx, L.title, L.gw + (L.side === "right" ? L.sbGap + L.sbW : 0)), L.ox, y0 + L.titleH / 2);
        y0 += L.titleH;
      }

      // グリッド
      const imgs = await Promise.all(state.cells.map(t => t ? loadImage(t.image).catch(() => null) : null));
      const numFont = document.fonts.check(`700 20px "Silkscreen"`) ? `700 22px "Silkscreen", monospace` : `700 24px "IBM Plex Sans JP", sans-serif`;
      state.cells.forEach((t, i) => {
        const c = i % state.cols, r = Math.floor(i / state.cols);
        const x = L.ox + c * (CELL_PX + GAP_PX), y = y0 + r * (CELL_PX + GAP_PX);
        ctx.fillStyle = light ? token("paper-3") : token("ink-2"); ctx.fillRect(x, y, CELL_PX, CELL_PX);
        if (imgs[i]) drawCover(ctx, imgs[i], x, y, CELL_PX, CELL_PX);
        if (state.numbers) {
          const label = String(i + 1).padStart(2, "0");
          ctx.font = numFont; ctx.textBaseline = "middle"; ctx.textAlign = "left";
          const bw = Math.ceil(ctx.measureText(label).width) + 24, bh = 40;
          ctx.fillStyle = badgeBg; ctx.fillRect(x, y, bw, bh);
          ctx.fillStyle = ink; ctx.fillRect(x + bw, y, 4, bh); ctx.fillRect(x, y + bh, bw + 4, 4);
          ctx.fillText(label, x + 12, y + bh / 2 + 1);
        }
      });

      // サイドバー（曲名リスト）
      if (L.side !== "none") {
        const sx = L.side === "right" ? L.ox + L.gw + L.sbGap : L.ox;
        const sy = L.side === "right" ? y0 : y0 + L.gh + L.sbGap;
        const colW = L.side === "right" ? L.sbW : Math.floor((L.sbW - GAP_PX * 2 * (L.sbCols - 1)) / L.sbCols);
        const perCol = L.side === "right" ? state.cells.length : Math.ceil(state.cells.length / L.sbCols);
        state.cells.forEach((t, i) => {
          const col = Math.floor(i / perCol), row = i % perCol;
          const x = sx + col * (colW + GAP_PX * 2), yy = sy + row * L.lineH + L.lineH / 2;
          ctx.textBaseline = "middle"; ctx.textAlign = "left";
          ctx.font = numFont.replace(/\d+px/, `${Math.round(L.fontS * 0.8)}px`); ctx.fillStyle = muted;
          const num = String(i + 1).padStart(2, "0"); ctx.fillText(num, x, yy);
          const nw = ctx.measureText(num).width + Math.round(L.fontS * 0.8);
          if (!t) return;
          ctx.fillStyle = ink; ctx.font = `700 ${L.fontS}px "IBM Plex Sans JP", sans-serif`;
          const tw = ctx.measureText(t.title).width;
          const maxW = colW - nw;
          if (tw >= maxW) { ctx.fillText(ellipsize(ctx, t.title, maxW), x + nw, yy); return; }
          ctx.fillText(t.title, x + nw, yy);
          ctx.fillStyle = muted; ctx.font = `400 ${L.fontS}px "IBM Plex Sans JP", sans-serif`;
          ctx.fillText(ellipsize(ctx, `  ${t.artist}`, maxW - tw), x + nw + tw, yy);
        });
      }

      const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
      if (els.download.href.startsWith("blob:")) URL.revokeObjectURL(els.download.href);
      const url = URL.createObjectURL(blob);
      els.outputImg.src = url; els.download.href = url; els.outputUrl.hidden = true;
      els.download.download = (L.title || "trackmento").replace(/[\\/:*?"<>|]/g, "_") + ".png";
      els.output.hidden = false;
      setBtnState(els.renderBtn, null);
      say(els.gridMsg, jpFontOK
        ? `${canvas.width} × ${canvas.height} px の PNG ができました。`
        : `${canvas.width} × ${canvas.height} px の PNG ができました。同梱フォント（IBM Plex Sans JP）が読めなかったので代替フォントで書き出しています。/fonts/ が配信されているか確認してください。`,
        jpFontOK ? null : "error");
      els.download.focus({ preventScroll: true });
    } catch (err) {
      setBtnState(els.renderBtn, "error");
      say(els.gridMsg, `画像を作れませんでした（${err.message}）。もう一度押してください。`, "error");
      setTimeout(() => setBtnState(els.renderBtn, null), 2500);
    }
  });

  renderSwatches();
  syncControls(); renderGrid();
  restore().finally(() => { ready = true; save(); loadHealth(); });
})();
</script>
</body>
</html>
