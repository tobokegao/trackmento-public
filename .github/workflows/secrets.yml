# 鍵の混入をpushのたびに見る（scripts/scan_secrets.sh）。
#
# 手元の `.githooks/pre-commit` が同じ判定をコミット時に行うが、そちらは通らない道がある:
#   - 別のマシンでクローンして `git config core.hooksPath .githooks` を忘れた
#   - `git commit --no-verify` を付けた
#   - GitHubの画面で直接編集した
# ここはその取りこぼしを拾う最後の網。
#
# GitHubのpush protection（無料）は発行元の分かる形しか止められず、R2の鍵のような
# 「ただの32／64文字の英数字」はすり抜ける。汎用パターンの検知はOrganization＋
# GitHub Team＋Secret Protection（月 $23〜）でしか使えないので、自前で見る。
#
# **依存は入れない**（gitとgrepだけ）。数秒で終わる。
name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 履歴の検査に使うので全部取る（fetch-depth: 0）
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 追跡ファイルの中身
        run: sh scripts/scan_secrets.sh tree

      # 履歴に `.env` 系が足された回を見る。2026-09-14の412582fは既知
      # （9/19の3eec4d2で除去、鍵は失効・再発行済み。docs/gotchas.md）。
      # **履歴からは消えないので、既知の1件を除いて判定する**
      - name: 履歴に新しい .envが足されていないか
        run: |
          known="412582f"
          # `.env.example` は見本なので除く（これを入れないと、雛形を作った回を毎回拾う）
          hits=$(git log --all --format='%h' --diff-filter=A \
                 -- '.env' '.env.*' '*.env' ':(exclude).env.example' ':(exclude)*/.env.example' \
                 | grep -v "^${known}" || true)
          if [ -n "$hits" ]; then
            echo "✖ 既知の1件（${known}）以外に、.env系が足されたコミットがあります:"
            for c in $hits; do git log -1 --format='  %h %ad %s' --date=short "$c"; done
            echo ""
            echo "新しい漏洩です。**まずその鍵を失効させる**（履歴の書き換えは後回し。"
            echo "force-pushはcloneを壊すうえ、GitHubはGC前のblobを残す）。"
            exit 1
          fi
          echo "既知の${known}だけ。新しいものは無し"
