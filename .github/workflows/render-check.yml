# Renderの状態を2時間おきに点検する（scripts/render_check.py）。
# 異常（再起動・帯域超過・5xx増加・[share] budgetなど）があればジョブを失敗させ、Issueを作る／既存のIssueにコメントする。
# 必要なSecret: RENDER_API_KEY（Render → Account Settings → API Keys）。
# 注意: GitHubのcronは混雑時に遅れる。60日pushが無いとscheduleは止まる（keepalive.ymlと同じ）。
# 2026-11-28: 2時間おきの指定でも実際の起動は1日2〜3回（間隔5〜12時間）だった。固定の「直近2時間」では
#   残りが穴になり、Renderのログ（約7日）が消えると埋め直せない。**定期の回と、untilを空にした手動の回は
#   --fill-gaps**（記録の切れ目を古い順に埋めてから今の窓を見る）。7日に1回でも起動すれば欠けない。
name: Render check

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "さかのぼる時間（untilを入れたときだけ使う）"
        default: "2"
      until:
        description: "窓の終わり（空なら今）。例2026-09-28 16:40（JST）。点検が飛んだ時間を後から埋めるとき"
        default: ""

permissions:
  contents: write   # 点検の数字をmetrics/series.jsonlに書き足すため
  issues: write

# 並べて走らせると同じ切れ目を二重に埋める。後から来た回は前の回が終わるのを待つ
concurrency:
  group: render-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # 窓1つは約10秒（/logsは30回/分の制限つき）。--max-windowsの60窓で10分ほど
    timeout-minutes: 25
    steps:
      # 起動時のコミットではなく、走り始めた時点のブランチの先を取る。concurrencyで待たされた回が
      # 前の回の足した行を知らずに、同じ切れ目を埋め直さないように
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 点検
        id: check
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          PYTHONUTF8: "1"
          UNTIL: ${{ inputs.until || '' }}
        run: |
          set +e
          if [ -n "$UNTIL" ]; then
            python scripts/render_check.py --hours "${{ inputs.hours || '2' }}" --until "$UNTIL" --strict --out summary.md --append metrics/series.jsonl
          else
            python scripts/render_check.py --fill-gaps --strict --out summary.md --append metrics/series.jsonl
          fi
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "要約なし（スクリプトが途中で落ちた）" | tee summary.md >> "$GITHUB_STEP_SUMMARY"
      # 点検の数字を1行ずつ残す（Renderのログは日が経つと消えるので、あとから推移を描けるように）。
      # **`metrics/` はrender.yamlのbuildFilterに入っていないので、これをpushしてもデプロイは走らない**
      - name: 推移の記録を足す
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -s metrics/series.jsonl || exit 0
          git add metrics/series.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "chore(metrics): 点検の数字を1行足す [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          echo "記録をpushできなかった（次の回の--fill-gapsが同じ時間を埋め直す）"

      - name: 異常ならIssueに書く
        if: steps.check.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          body="$(cat summary.md)"$'\n\n'"実行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --label render-check --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create render-check --description "Renderの自動点検" --color D93F0B 2>/dev/null || true
            gh issue create --title "Render点検: 異常あり（$(date -u +%m/%d) ）" --label render-check --body "$body"
          fi
      - name: 結果
        run: |
          code="${{ steps.check.outputs.code }}"
          test "$code" = "0" || { echo "異常あり（終了コード $code）"; exit 1; }
