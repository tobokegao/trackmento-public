# Renderの状態を2時間おきに点検する（scripts/render_check.py）。
# 異常（再起動・帯域超過・5xx増加・[share] budgetなど）があればジョブを失敗させ、Issueを作る／既存のIssueにコメントする。
# 必要なSecret: RENDER_API_KEY（Render → Account Settings → API Keys）。
# 注意: GitHubのcronは混雑時に遅れる。60日pushが無いとscheduleは止まる（keepalive.ymlと同じ）。
name: Render check

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "さかのぼる時間"
        default: "2"
      until:
        description: "窓の終わり（空なら今）。例2026-09-28 16:40（JST）。点検が飛んだ時間を後から埋めるとき"
        default: ""

permissions:
  contents: write   # 点検の数字をmetrics/series.jsonlに書き足すため
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 点検
        id: check
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          PYTHONUTF8: "1"
          UNTIL: ${{ inputs.until || '' }}
        run: |
          set +e
          python scripts/render_check.py --hours "${{ inputs.hours || '2' }}" ${UNTIL:+--until "$UNTIL"} --strict --out summary.md --append metrics/series.jsonl
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "要約なし（スクリプトが途中で落ちた）" | tee summary.md >> "$GITHUB_STEP_SUMMARY"
      # 点検の数字を1行ずつ残す（Renderのログは日が経つと消えるので、あとから推移を描けるように）。
      # **`metrics/` はrender.yamlのbuildFilterに入っていないので、これをpushしてもデプロイは走らない**
      - name: 推移の記録を足す
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -s metrics/series.jsonl || exit 0
          git add metrics/series.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "chore(metrics): 点検の数字を1行足す [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          echo "記録をpushできなかった（次の点検でまとめて入る）"

      - name: 異常ならIssueに書く
        if: steps.check.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          body="$(cat summary.md)"$'\n\n'"実行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --label render-check --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create render-check --description "Renderの自動点検" --color D93F0B 2>/dev/null || true
            gh issue create --title "Render点検: 異常あり（$(date -u +%m/%d) ）" --label render-check --body "$body"
          fi
      - name: 結果
        run: |
          code="${{ steps.check.outputs.code }}"
          test "$code" = "0" || { echo "異常あり（終了コード $code）"; exit 1; }
