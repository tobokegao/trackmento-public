# GitHub Pages にフロントを公開する。
# 事前に: リポジトリの Settings → Pages → Source を "GitHub Actions" に、
#          Settings → Secrets and variables → Actions → Variables に TRACKMENTO_API（バックエンドの URL）を登録する。
name: Deploy frontend to GitHub Pages

# 既定では手動実行のみ（Render 単体の構成では使わない）。Pages を使うときは Actions タブから Run workflow、
# または下の push トリガーのコメントを外す。
on:
  workflow_dispatch:
  # push:
  #   branches: [main, master]
  #   paths: [frontend/**, fonts/**, scripts/build_pages.py, .github/workflows/pages.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build static site
        run: python scripts/build_pages.py --api "${{ vars.TRACKMENTO_API }}" --out dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
