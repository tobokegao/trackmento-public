# GitHub Pages にフロントを公開する。
# 事前に: リポジトリの Settings → Pages → Source を "GitHub Actions" に、
#          Settings → Secrets and variables → Actions → Variables に TRACKMENTO_API（バックエンドの URL）を登録する。
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main, master]
    paths: [frontend/**, fonts/**, scripts/build_pages.py, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build static site
        run: python scripts/build_pages.py --api "${{ vars.TRACKMENTO_API }}" --out dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
