# Render 無料プランはアクセスが 15 分無いとサーバーが眠り、次の 1 回目に 30〜60 秒かかる。
# 10 分おきに /health を叩いて眠らせない（Googlebot の取得失敗・利用者の初回待ちを防ぐ）ためのワークフロー。
#
# 2026-09-12: schedule を停止した（コメントアウト）。手動実行（workflow_dispatch）は残してある。
#
# 停止した理由:
#   1. 現在 Render は Pro プランで、そもそもスリープしないので不要。
#   2. GitHub の cron が大幅に間引かれており、keepalive として機能していなかった。
#      cron は "*/10"（10 分おき）指定だったが、実測の発火間隔は 2〜5 時間おき。
#      例（event=schedule の実績）: 09/12 06:14Z → 09/12 01:23Z → 09/11 23:22Z → 21:19Z → 18:38Z → 15:16Z
#      15 分でスリープする相手に対し、2〜5 時間おきの ping では最初から間に合わない。
#
# フリープランに戻すときの注意（ここが重要）:
#   このワークフローの schedule を復活させても、上記 2 の理由でスリープは防げない。
#   フリーに戻すなら UptimeRobot や cron-job.org など GitHub 外の監視サービスから
#   5 分間隔で /health を叩く形に置き換えること。
#
# フリープランに戻せるかの判定基準（2026-09-12 時点の実測から）:
#   - 帯域: フリー枠は 100 GB/月 = 1 日あたり 3.3 GB。
#     実測は直近 24 時間で 39.96 GB（月換算 約 1200 GB）、落ち着いた直近 2 時間ベースでも
#     1 日 14 GB（月換算 約 421 GB）。現状の 1/4 以下に下がるまでフリーは不可能。
#     `scripts/render_check.py --hours 24` の帯域が 3 GB 以下で数日続いたら検討を始める。
#   - メモリ: フリーは 512 MB 上限。直近 24 時間のピークは rss 506 MB でほぼ天井だった。
#     落ち着いた時間帯は 258 MB なので、バズが収まれば収まる見込み。
#
# TODO（後日）: 上記はバズ直後の 2026-09-12 時点の判断。トラフィックが落ち着いた頃に
#   Fable 5.1 にも同じ材料（render_check の 24 時間集計・帯域・メモリ）を渡して、
#   フリープランへ戻す是非と keepalive の代替手段をあらためて検討してもらう。
name: Keep Render awake

on:
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /health（眠っていれば起こす。最大 90 秒待つ）
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 --retry 2 --retry-delay 10 https://trackmento.onrender.com/health || true)
          echo "health: $code"
          test "$code" = "200"
