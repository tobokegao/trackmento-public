# Render無料プランはアクセスが15分無いとサーバーが眠り、次の1回目に30〜60秒かかる。
# 10分おきに /healthを叩いて眠らせない（Googlebotの取得失敗・利用者の初回待ちを防ぐ）ためのワークフロー。
#
# 2026-09-12: scheduleを停止した（コメントアウト）。手動実行（workflow_dispatch）は残してある。
#
# 停止した理由:
#   1. 現在RenderはProプランで、そもそもスリープしないので不要。
#   2. GitHubのcronが大幅に間引かれており、keepaliveとして機能していなかった。
#      cronは "*/10"（10分おき）指定だったが、実測の発火間隔は2〜5時間おき。
#      例（event=scheduleの実績）: 09/12 06:14Z → 09/12 01:23Z → 09/11 23:22Z → 21:19Z → 18:38Z → 15:16Z
#      15分でスリープする相手に対し、2〜5時間おきのpingでは最初から間に合わない。
#
# フリープランに戻すときの注意（ここが重要）:
#   このワークフローのscheduleを復活させても、上記2の理由でスリープは防げない。
#   フリーに戻すならUptimeRobotやcron-job.orgなどGitHub外の監視サービスから
#   5分間隔で /healthを叩く形に置き換えること。
#
# フリープランに戻せるかの判定基準（2026-09-12時点の実測から）:
#   - 帯域: フリー枠は100 GB/月 = 1日あたり3.3 GB。
#     実測は直近24時間で39.96 GB（月換算 約1200 GB）、落ち着いた直近2時間ベースでも
#     1日14 GB（月換算 約421 GB）。現状の1/4以下に下がるまでフリーは不可能。
#     `scripts/render_check.py --hours 24` の帯域が3 GB以下で数日続いたら検討を始める。
#   - メモリ: フリーは512 MB上限。直近24時間のピークはrss 506 MBでほぼ天井だった。
#     落ち着いた時間帯は258 MBなので、バズが収まれば収まる見込み。
#
# TODO（後日）: 上記はバズ直後の2026-09-12時点の判断。トラフィックが落ち着いた頃に
#   Fable 5.1にも同じ材料（render_checkの24時間集計・帯域・メモリ）を渡して、
#   フリープランへ戻す是非とkeepaliveの代替手段をあらためて検討してもらう。
name: Keep Render awake

on:
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /health（眠っていれば起こす。最大90秒待つ）
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 --retry 2 --retry-delay 10 https://trackmento.com/health || true)
          echo "health: $code"
          test "$code" = "200"
