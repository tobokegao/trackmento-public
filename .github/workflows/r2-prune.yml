# 期限を過ぎた共有ファイルを R2 から消す（scripts/r2_prune.py）。
# R2 のライフサイクル規則はプレフィックスでしか対象を指定できず、共有ファイルの名前はランダムな
# 12 桁なので絞り込めない。空のプレフィックスで規則を作ると fonts/ まで消えて本番のフォントが
# 404 になるため、削除はこのワークフローで行う（fonts/ は scripts/r2_prune.py が除外する）。
# 必要な Secret: R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_BUCKET。
# 注意: GitHub の cron は混雑時に大きく遅れる。1 日 1 回の掃除なので数時間ずれても問題ない。
name: R2 prune

on:
  schedule:
    - cron: "41 18 * * *"   # 毎日 03:41 JST（利用が少ない時間帯）
  workflow_dispatch:
    inputs:
      hours:
        # 手で回したときの既定も、定期実行と同じ 720 時間（30 日）にする。168 のままだと、
        # 既定のまま実行しただけで 7〜30 日前の共有（約 9GB）が消え、30 日保存の約束を破る（2026-09-19 に気付いた）
        description: "これより古いものを消す（時間）"
        default: "720"
      apply:
        description: "実際に消す（false なら数えるだけ）"
        default: "true"

permissions:
  contents: write   # 種類ごとの件数を metrics/r2.jsonl に書き足すため

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 依存
        run: pip install boto3 python-dotenv
      - name: 掃除
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PYTHONUTF8: "1"
        run: |
          hours="${{ inputs.hours || '720' }}"
          # --append で種類ごとの件数と容量を 1 行残す。掃除はどのみち全件を一覧するので、
          # ここに相乗りすれば運用ボードの「R2 の使用量」に追加の Class A を払わずに済む
          if [ "${{ inputs.apply || 'true' }}" = "true" ]; then
            python scripts/r2_prune.py --older-than-hours "$hours" --apply --append metrics/r2.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python scripts/r2_prune.py --older-than-hours "$hours" --append metrics/r2.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # 記録を残す（render-check.yml と同じやり方。metrics/ は buildFilter に無いのでデプロイは走らない）
      - name: 記録を足す
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -s metrics/r2.jsonl || exit 0
          git add metrics/r2.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "chore(metrics): R2 の内訳を 1 行足す [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          echo "記録を push できなかった（次の掃除でまとめて入る）"
