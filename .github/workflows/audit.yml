# 依存パッケージの脆弱性監査（pip-audit）と、公開モードでの起動テスト。
# - 毎週月曜（Dependabot の PR と同じ日）と、push / PR のたびに実行
# - 既知の脆弱性がある固定バージョンが残っていれば失敗して知らせる
name: Audit dependencies

on:
  schedule:
    - cron: "0 1 * * 1"    # 毎週月曜 01:00 UTC（10:00 JST）
  push:
    branches: [main, master]
    paths: [requirements.txt, Dockerfile, backend/**, .github/workflows/audit.yml]
  pull_request:
    paths: [requirements.txt, Dockerfile, backend/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"     # Dockerfile と同じ
      - name: Install
        run: pip install -r requirements.txt
      - name: pip-audit（既知の脆弱性）
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt
      - name: 起動テスト（公開モードでアプリを読み込み、主要ルートを叩く）
        env:
          PUBLIC_MODE: "1"
          TRUST_PROXY: "1"
          RATE_LIMIT: "0"
        run: |
          python - <<'EOF'
          import asyncio, httpx
          from backend.main import app
          async def main():
              async with app.router.lifespan_context(app):
                  async with httpx.AsyncClient(transport=httpx.ASGITransport(app=app), base_url="http://test") as c:
                      r = await c.get("/health"); assert r.status_code == 200, r.text
                      r = await c.get("/"); assert r.status_code == 200 and "nonce-" in r.headers.get("content-security-policy", ""), r.headers
                      r = await c.get("/image-proxy?url=http://169.254.169.254/"); assert r.status_code == 403, r.status_code
                      r = await c.post("/render", json={}); assert r.status_code == 404, r.status_code
                      r = await c.put("/grids/u-abababababababab", json={"cols": 1, "rows": 1, "cells": [{"source": "manual", "title": "t", "artist": "a", "image": "javascript:x"}]})
                      assert r.status_code == 200 and r.json()["cells"] == [None], r.text
              print("smoke ok")
          asyncio.run(main())
          EOF
