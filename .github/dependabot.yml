# 依存パッケージの更新を自動でPRにする（GitHub Dependabot）。
# - pip: requirements.txtの固定バージョンを毎週チェック
# - docker: Dockerfileのベースイメージ（python:3.12-slim）
# - github-actions: ワークフローで使うアクション
# PRはaudit.yml（脆弱性監査＋起動テスト）が通ったのを確認してマージする。masterに入るとRenderが自動デプロイする。
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      python-deps:           # 小さな更新はまとめて1本のPRにする
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    labels: [dependencies]
