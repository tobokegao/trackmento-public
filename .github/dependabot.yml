# 依存パッケージの更新を自動で PR にする（GitHub Dependabot）。
# - pip: requirements.txt の固定バージョンを毎週チェック
# - docker: Dockerfile のベースイメージ（python:3.12-slim）
# - github-actions: ワークフローで使うアクション
# PR は audit.yml（脆弱性監査＋起動テスト）が通ったのを確認してマージする。master に入ると Render が自動デプロイする。
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      python-deps:           # 小さな更新はまとめて 1 本の PR にする
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    labels: [dependencies]
