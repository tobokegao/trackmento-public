# Render (https://render.com) の Blueprint。ダッシュボードで "New → Blueprint" からこのリポジトリを選ぶと作成される。
# Render 単体で公開する構成（フロントもこのサービスが / で配信する）。
# ディスクは再デプロイで消える（検索キャッシュ・アップロード画像は消えてよい前提。共有 PNG は Cloudflare R2 に置く）。
#
# **plan はここの値がそのまま本番に適用される**。このファイルを 1 文字でも変えて push すると
# Blueprint がサービス定義を作り直し、ダッシュボードで上げたインスタンスも巻き戻す。
# 2026-09-15 に、ここが `free` のままだったせいで Standard（1c-2g）から Free へ落ちた
# （Free はアクセスが無いとスリープし、次のアクセスで 30〜60 秒かかる。メモリも 512MB）。
# **インスタンスを変えたら、ダッシュボードだけでなくここも直す**
services:
  - type: web
    name: trackmento
    runtime: docker
    plan: standard   # 1c-2g。落とすときはダッシュボードとここの両方を直す
    healthCheckPath: /health
    # 独自ドメイン（2026-09-19 に明記）。Blueprint の同期でダッシュボードの設定が巻き戻ることがあるので、
    # 消えないよう書いておく。www は Render が自動で扱う（本体へ転送）
    domains:
      - trackmento.com
    # **サーバーに関係あるファイルが変わったときだけデプロイする**（2026-09-19）。CLAUDE.md・promo/・scripts/ だけの
    # コミットでもデプロイし直され、そのたびに cache.sqlite3 が消えてサーバーが入れ替わっていた（1 日 10 回以上）。
    # Docker イメージに入るもの（Dockerfile の COPY）と同じ範囲にする。COPY を足したらここも足す
    buildFilter:
      paths:
        - Dockerfile
        - requirements.txt
        - backend/**
        - frontend/**
        - fonts/**
        - cli.py
    envVars:
      - key: PUBLIC_MODE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: PUBLIC_BASE_URL
        value: https://trackmento.com   # OG タグ・共有 URL の基準。リクエストの Host ヘッダに頼らない（2026-09-18 に独自ドメインへ）
      # **ドメインを引っ越すときだけ設定する**（例 https://trackmento.com）。入れると、これと違うホストで
      # 来た要求のうち共有ページ・/find・robots・sitemap は 301 で移転先へ送り、画面（/）はそのまま返す。
      # 画面は自分でブラウザの保存（並び・パレット・言語）を持って移転先へ移動する。
      # 切り替えの手順は CLAUDE.md の「ドメインの引っ越し」を参照。空なら何もしない
      - key: MIGRATE_TO
        value: https://trackmento.com
      - key: MB_USER_AGENT
        value: trackmento/0.1 (https://github.com/tobokegao/trackmento-public)   # MusicBrainz の要件（連絡先入り）
      - key: RATE_LIMIT
        value: "120"
      # 共有は 30 日で消える（2026-09-15 に 7 日から延ばした）。実測で 1 日 2.55GB・約 2,800 件なので
      # 30 日で約 82GB。R2 は 10GB まで無料・超過分 $0.015/GB・月なので月 $1 ほど
      - key: SHARE_RETENTION_DAYS
        value: "30"
      - key: SHARE_BUDGET_GB
        value: "120"
      # **回数の上限は 0（無制限）**。容量は SHARE_BUDGET_GB（実バイト数）で守る。
      # 2026-09-15 にこのファイルを変更したところ、ここの値（当時 20 / 200）が本番へ再適用され、
      # 本日の共有が 3,788 件の時点で上限 200 に当たってすべて 429 になった。
      # ログの「本日の共有数を復元: N 件（上限 …）」で、それまで無制限だったことを確認して戻した
      - key: SHARE_LIMIT_PER_IP_DAY   # 端末（IP）ごとの 1 日の共有数。0 は無制限（2026-09-19 に 0 → 50）
        value: "50"
      - key: SHARE_LIMIT_PER_DAY
        value: "0"
      # 共有 PNG を Cloudflare R2 に置く。値はダッシュボードで入れる（リポジトリに書かない）
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: GOOGLE_SITE_VERIFICATION   # Search Console の「HTML タグ」の content 値。未設定ならタグは出ない
        sync: false
      # Spotify の公式 Web API（Client Credentials）。無いと曲名とジャケット 300px だけの oEmbed に落ち、
      # プレイリストはまとめて取れない（2026-09-20 に、ページの読み取りから公式 API へ移した）
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      # YouTube Data API v3 のキー。無いと再生リストをまとめて取れない（単体の動画は oEmbed なので要らない）
      - key: YOUTUBE_API_KEY
        sync: false
      # 公開版では Discogs を使わない（DISCOGS_TOKEN を入れなければソースに出ない）。
      # GitHub Pages も使う場合だけ CORS_ORIGINS と FRONTEND_URL を追加する（README「公開する」B 参照）
