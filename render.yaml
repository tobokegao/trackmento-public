# Render (https://render.com) のBlueprint。ダッシュボードで "New → Blueprint" からこのリポジトリを選ぶと作成される。
# Render単体で公開する構成（フロントもこのサービスが / で配信する）。
# ディスクは再デプロイで消える（検索キャッシュ・アップロード画像は消えてよい前提。共有PNGはCloudflare R2に置く）。
#
# **planはここの値がそのまま本番に適用される**。このファイルを1文字でも変えてpushすると
# Blueprintがサービス定義を作り直し、ダッシュボードで上げたインスタンスも巻き戻す。
# 2026-09-15に、ここが `free` のままだったせいでStandard（1c-2g）からFreeへ落ちた
# （Freeはアクセスが無いとスリープし、次のアクセスで30〜60秒かかる。メモリも512MB）。
# **インスタンスを変えたら、ダッシュボードだけでなくここも直す**
services:
  - type: web
    name: trackmento
    runtime: docker
    plan: standard   # 1c-2g。落とすときはダッシュボードとここの両方を直す
    healthCheckPath: /health
    # 独自ドメイン（2026-09-19に明記）。Blueprintの同期でダッシュボードの設定が巻き戻ることがあるので、
    # 消えないよう書いておく。wwwはRenderが自動で扱う（本体へ転送）
    domains:
      - trackmento.com
    # **サーバーに関係あるファイルが変わったときだけデプロイする**（2026-09-19）。CLAUDE.md・promo/・scripts/ だけの
    # コミットでもデプロイし直され、そのたびにcache.sqlite3が消えてサーバーが入れ替わっていた（1日10回以上）。
    # Dockerイメージに入るもの（DockerfileのCOPY）と同じ範囲にする。COPYを足したらここも足す
    buildFilter:
      paths:
        - Dockerfile
        - requirements.txt
        - backend/**
        - frontend/**
        - fonts/**
        - cli.py
    envVars:
      - key: PUBLIC_MODE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: PUBLIC_BASE_URL
        value: https://trackmento.com   # OGタグ・共有URLの基準。リクエストのHostヘッダに頼らない（2026-09-18に独自ドメインへ）
      # **ドメインを引っ越すときだけ設定する**（例https://trackmento.com）。入れると、これと違うホストで
      # 来た要求のうち共有ページ・/find・robots・sitemapは301で移転先へ送り、画面（/）はそのまま返す。
      # 画面は自分でブラウザの保存（並び・パレット・言語）を持って移転先へ移動する。
      # 切り替えの手順はCLAUDE.mdの「ドメインの引っ越し」を参照。空なら何もしない
      - key: MIGRATE_TO
        value: https://trackmento.com
      - key: MB_USER_AGENT
        value: trackmento/0.1 (https://github.com/tobokegao/trackmento-public)   # MusicBrainzの要件（連絡先入り）
      - key: RATE_LIMIT
        value: "120"
      # 共有は30日で消える（2026-09-15に7日から延ばした）。実測で1日2.55GB・約2,800件なので
      # 30日で約82GB。R2は10GBまで無料・超過分 $0.015/GB・月なので月 $1ほど
      - key: SHARE_RETENTION_DAYS
        value: "30"
      - key: SHARE_BUDGET_GB
        value: "120"
      # **回数の上限は0（無制限）**。容量はSHARE_BUDGET_GB（実バイト数）で守る。
      # 2026-09-15にこのファイルを変更したところ、ここの値（当時20 / 200）が本番へ再適用され、
      # 本日の共有が3,788件の時点で上限200に当たってすべて429になった。
      # ログの「本日の共有数を復元: N件（上限 …）」で、それまで無制限だったことを確認して戻した
      - key: SHARE_LIMIT_PER_IP_DAY   # 端末（IP）ごとの1日の共有数。0は無制限（2026-09-19に0 → 50）
        value: "50"
      - key: SHARE_LIMIT_PER_DAY
        value: "0"
      # 共有PNGをCloudflare R2に置く。値はダッシュボードで入れる（リポジトリに書かない）
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: GOOGLE_SITE_VERIFICATION   # Search Consoleの「HTMLタグ」のcontent値。未設定ならタグは出ない
        sync: false
      # Spotifyの公式Web API（Client Credentials）。無いと曲名とジャケット300pxだけのoEmbedに落ち、
      # プレイリストはまとめて取れない（2026-09-20に、ページの読み取りから公式APIへ移した）
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      # YouTube Data API v3のキー。無いと再生リストをまとめて取れない（単体の動画はoEmbedなので要らない）
      - key: YOUTUBE_API_KEY
        sync: false
      # 公開版ではDiscogsを使わない（DISCOGS_TOKENを入れなければソースに出ない）。
      # GitHub Pagesも使う場合だけCORS_ORIGINSとFRONTEND_URLを追加する（README「公開する」B参照）
