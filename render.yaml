# Render (https://render.com) の Blueprint。ダッシュボードで "New → Blueprint" からこのリポジトリを選ぶと作成される。
# 無料プランはアクセスが無いとスリープし、次のアクセスで 30〜60 秒かかる。ディスクは再デプロイで消える
# （検索キャッシュ・共有 PNG・アップロード画像は消えてよい前提。残したければ有料の Disk を付ける）。
services:
  - type: web
    name: trackmento
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_MODE
        value: "1"
      - key: CORS_ORIGINS
        value: https://YOUR-GITHUB-USER.github.io     # ← GitHub Pages のオリジンに変える
      - key: FRONTEND_URL
        value: https://YOUR-GITHUB-USER.github.io/musicgrid-local   # ← Pages の URL に変える
      - key: MB_USER_AGENT
        value: trackmento/0.1 (your-email@example.com)             # ← 連絡先を入れる（MusicBrainz の要件）
      - key: DISCOGS_TOKEN
        sync: false   # ダッシュボードで値を入れる（リポジトリに書かない）
      - key: RATE_LIMIT
        value: "120"
      - key: TRUST_PROXY
        value: "1"
